<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>LVBC</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root {
    --void: #0D1117;
    --surface: #161C26;
    --raised: #1E2733;
    --teal: #2AB8A6;
    --amber: #E8B84B;
    --red: #E05252;
    --purple: #BF5FFF;
    --header: #3E4E6C;
    --text: #F2EDE4;
    --sub: #8E92B0;
    --muted: #5C607E;
    --border: #2E3440;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { background: var(--void); color: var(--text); font-family: 'DM Sans', sans-serif; min-height: 100vh; max-width: 480px; margin: 0 auto; }

  /* LOGIN */
  #login-screen {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px 24px;
  }
  .login-logo { font-family: 'Bebas Neue', sans-serif; font-size: 52px; letter-spacing: 6px; color: var(--teal); margin-bottom: 4px; }
  .login-sub { font-size: 12px; font-family: 'DM Mono', monospace; color: var(--muted); letter-spacing: 3px; text-transform: uppercase; margin-bottom: 48px; }
  .login-card { width: 100%; background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 28px 24px; }
  .login-title { font-size: 18px; font-weight: 600; margin-bottom: 6px; }
  .login-desc { font-size: 13px; color: var(--sub); margin-bottom: 24px; }
  .input { width: 100%; background: var(--raised); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 16px; outline: none; transition: border-color 0.15s; }
  .input:focus { border-color: var(--teal); }
  .input::placeholder { color: var(--muted); }
  .btn-full { width: 100%; padding: 14px; border-radius: 10px; border: none; font-family: 'DM Sans', sans-serif; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 12px; transition: all 0.15s; }
  .btn-primary { background: var(--teal); color: var(--void); }
  .btn-primary:active { background: #1f8f80; }
  .error-msg { font-size: 13px; color: var(--red); margin-top: 10px; text-align: center; display: none; }

  /* APP */
  #app-screen { display: none; min-height: 100vh; flex-direction: column; }
  #app-screen.visible { display: flex; }

  /* HEADER */
  .app-header {
    background: var(--header);
    padding: 16px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }
  .app-logo { font-family: 'Bebas Neue', sans-serif; font-size: 20px; letter-spacing: 3px; color: var(--teal); }
  .signout-btn { font-size: 12px; color: var(--muted); font-family: 'DM Mono', monospace; background: none; border: none; cursor: pointer; padding: 4px 8px; }

  /* BOTTOM NAV */
  .bottom-nav {
    position: fixed;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 100%;
    max-width: 480px;
    background: var(--surface);
    border-top: 1px solid var(--border);
    display: flex;
    z-index: 100;
  }
  .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 10px 0 14px; cursor: pointer; border: none; background: none; color: var(--muted); font-size: 10px; font-family: 'DM Sans', sans-serif; gap: 4px; transition: color 0.15s; }
  .nav-item.active { color: var(--teal); }
  .nav-icon { font-size: 20px; line-height: 1; }

  /* CONTENT */
  .content { flex: 1; overflow-y: auto; padding: 20px 20px 90px; }

  /* SCREENS */
  .tab { display: none; animation: fadeIn 0.2s ease; }
  .tab.active { display: block; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

  /* QR SCREEN */
  .member-greeting { margin-bottom: 20px; }
  .greeting-name { font-family: 'Bebas Neue', sans-serif; font-size: 32px; letter-spacing: 1px; }
  .greeting-tier { display: inline-block; margin-top: 4px; }

  .tier { display: inline-block; padding: 3px 12px; border-radius: 12px; font-size: 12px; font-weight: 600; }
  .tier-mug { background: rgba(42,184,166,0.15); color: var(--teal); border: 1px solid rgba(42,184,166,0.3); }
  .tier-coffee { background: rgba(232,184,75,0.15); color: var(--amber); border: 1px solid rgba(232,184,75,0.3); }
  .tier-full { background: rgba(191,95,255,0.15); color: var(--purple); border: 1px solid rgba(191,95,255,0.3); }
  .tier-free { background: rgba(142,155,176,0.1); color: var(--sub); border: 1px solid var(--border); }

  .qr-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 28px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-bottom: 16px;
  }
  .qr-label { font-size: 11px; font-family: 'DM Mono', monospace; color: var(--muted); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 20px; }
  #qr-container { background: white; padding: 16px; border-radius: 12px; margin-bottom: 20px; }
  .qr-token { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--muted); }

  .points-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
  .points-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
  .points-label { font-size: 10px; font-family: 'DM Mono', monospace; color: var(--muted); letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 6px; }
  .points-val { font-family: 'Bebas Neue', sans-serif; font-size: 32px; line-height: 1; }
  .points-val.teal { color: var(--teal); }
  .points-unit { font-size: 11px; color: var(--sub); margin-top: 2px; }

  /* ACTIVITY */
  .section-title { font-size: 11px; font-family: 'DM Mono', monospace; color: var(--muted); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 12px; }
  .activity-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  .activity-item { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; border-bottom: 1px solid var(--border); }
  .activity-item:last-child { border-bottom: none; }
  .activity-date { font-size: 13px; font-weight: 500; }
  .activity-sub { font-size: 11px; color: var(--sub); font-family: 'DM Mono', monospace; margin-top: 2px; }
  .activity-pts { font-family: 'Bebas Neue', sans-serif; font-size: 22px; color: var(--teal); }
  .empty-state { text-align: center; padding: 32px; color: var(--muted); font-size: 13px; font-family: 'DM Mono', monospace; }

  /* BEERS */
  .beer-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 10px; }
  .beer-name { font-weight: 600; font-size: 15px; margin-bottom: 4px; }
  .beer-style { font-size: 12px; color: var(--teal); font-family: 'DM Mono', monospace; margin-bottom: 8px; }
  .beer-desc { font-size: 13px; color: var(--sub); line-height: 1.5; }
  .beer-meta { display: flex; gap: 10px; margin-top: 10px; }
  .beer-abv { font-size: 11px; font-family: 'DM Mono', monospace; color: var(--muted); background: var(--raised); padding: 3px 10px; border-radius: 8px; }
  .beer-new { font-size: 11px; font-family: 'DM Mono', monospace; color: var(--amber); background: rgba(232,184,75,0.1); border: 1px solid rgba(232,184,75,0.3); padding: 3px 10px; border-radius: 8px; }

  /* REWARDS */
  .reward-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
  .reward-name { font-weight: 500; font-size: 14px; }
  .reward-tier-label { font-size: 11px; color: var(--sub); margin-top: 3px; }
  .reward-cost { font-family: 'Bebas Neue', sans-serif; font-size: 24px; color: var(--amber); text-align: right; }
  .reward-cost-unit { font-size: 10px; color: var(--muted); font-family: 'DM Mono', monospace; }
  .reward-locked { opacity: 0.4; }

  /* LOADING */
  .loading { text-align: center; padding: 40px 0; color: var(--muted); font-size: 13px; font-family: 'DM Mono', monospace; }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-logo">LVBC</div>
  <div class="login-sub">Lago Vista Brewing Co.</div>
  <div class="login-card">
    <div class="login-title">Member Login</div>
    <div class="login-desc">Enter the email address on your account.</div>
    <input class="input" type="email" id="login-email" placeholder="your@email.com" autocomplete="email">
    <button class="btn-full btn-primary" onclick="login()">Sign In</button>
    <div class="error-msg" id="login-error">No account found with that email.</div>
  </div>
</div>

<!-- APP -->
<div id="app-screen">
  <div class="app-header">
    <div class="app-logo">LVBC</div>
    <button class="signout-btn" onclick="signOut()">Sign Out</button>
  </div>

  <div class="content">
    <!-- QR TAB -->
    <div class="tab active" id="tab-qr">
      <div class="member-greeting">
        <div class="greeting-name" id="member-name">—</div>
        <div class="greeting-tier"><span class="tier" id="member-tier">—</span></div>
      </div>
      <div class="qr-card">
        <div class="qr-label">Scan at the bar</div>
        <div id="qr-container"></div>
        <div class="qr-token" id="qr-token-text">—</div>
      </div>
      <div class="points-row">
        <div class="points-card">
          <div class="points-label">Balance</div>
          <div class="points-val teal" id="member-balance">—</div>
          <div class="points-unit">points</div>
        </div>
        <div class="points-card">
          <div class="points-label">Lifetime</div>
          <div class="points-val" id="member-lifetime">—</div>
          <div class="points-unit">earned total</div>
        </div>
      </div>
    </div>

    <!-- ACTIVITY TAB -->
    <div class="tab" id="tab-activity">
      <div class="section-title" style="margin-bottom:16px">Recent Check-Ins</div>
      <div class="activity-card" id="activity-list">
        <div class="loading">Loading...</div>
      </div>
    </div>

    <!-- BEERS TAB -->
    <div class="tab" id="tab-beers">
      <div class="section-title" style="margin-bottom:16px">On Tap Now</div>
      <div id="beer-list"><div class="loading">Loading...</div></div>
    </div>

    <!-- REWARDS TAB -->
    <div class="tab" id="tab-rewards">
      <div class="section-title" style="margin-bottom:16px">Rewards</div>
      <div id="rewards-list"></div>
    </div>
  </div>

  <nav class="bottom-nav">
    <button class="nav-item active" onclick="showTab('qr', this)">
      <span class="nav-icon">⬡</span>
      <span>My Card</span>
    </button>
    <button class="nav-item" onclick="showTab('activity', this)">
      <span class="nav-icon">↻</span>
      <span>Activity</span>
    </button>
    <button class="nav-item" onclick="showTab('beers', this)">
      <span class="nav-icon">⬡</span>
      <span>On Tap</span>
    </button>
    <button class="nav-item" onclick="showTab('rewards', this)">
      <span class="nav-icon">★</span>
      <span>Rewards</span>
    </button>
  </nav>
</div>

<script>
const SUPABASE_URL = 'https://opsplpqvordihoktuqzp.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9wc3BscHF2b3JkaWhva3R1cXpwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY3OTI0MjMsImV4cCI6MjA5MjM2ODQyM30.SIYWZXqM3o-6q1EdEBn-IpdG90JrLBZbbiNrjj6AG7Y';

const headers = {
  'apikey': SUPABASE_KEY,
  'Authorization': `Bearer ${SUPABASE_KEY}`,
  'Content-Type': 'application/json'
};

async function sb(path) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, { headers });
  const text = await res.text();
  return text ? JSON.parse(text) : [];
}

let currentMember = null;

async function login() {
  const email = document.getElementById('login-email').value.trim().toLowerCase();
  if (!email) return;
  const results = await sb(`members?email=ilike.${email}&select=*`);
  if (!results.length) {
    document.getElementById('login-error').style.display = 'block';
    return;
  }
  currentMember = results[0];
  localStorage.setItem('lvbc_member_id', currentMember.id);
  loadApp();
}

async function loadApp() {
  if (!currentMember) {
    const savedId = localStorage.getItem('lvbc_member_id');
    if (savedId) {
      const results = await sb(`members?id=eq.${savedId}&select=*`);
      if (results.length) currentMember = results[0];
    }
  }
  if (!currentMember) return;

  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app-screen').classList.add('visible');

  // Member info
  document.getElementById('member-name').textContent = currentMember.name;
  document.getElementById('member-balance').textContent = currentMember.points_balance;
  document.getElementById('member-lifetime').textContent = currentMember.points_earned_lifetime;

  const tierEl = document.getElementById('member-tier');
  tierEl.textContent = currentMember.tier;
  tierEl.className = 'tier ' + tierClass(currentMember.tier);

  // QR code
  const tokens = await sb(`qr_tokens?member_id=eq.${currentMember.id}&select=token&limit=1`);
  const token = tokens[0]?.token || currentMember.id.toString();
  document.getElementById('qr-token-text').textContent = token;
  document.getElementById('qr-container').innerHTML = '';
  new QRCode(document.getElementById('qr-container'), {
    text: token,
    width: 200,
    height: 200,
    colorDark: '#000000',
    colorLight: '#ffffff',
    correctLevel: QRCode.CorrectLevel.M
  });

  loadActivity();
  loadBeers();
  loadRewards();
}

async function loadActivity() {
  const checkins = await sb(`check_ins?member_id=eq.${currentMember.id}&select=*&order=checked_in_at.desc&limit=10`);
  const el = document.getElementById('activity-list');
  if (!checkins.length) {
    el.innerHTML = '<div class="empty-state">No check-ins yet</div>';
    return;
  }
  el.innerHTML = checkins.map(c => `
    <div class="activity-item">
      <div>
        <div class="activity-date">${new Date(c.checked_in_at).toLocaleDateString('en-US', {weekday:'short', month:'short', day:'numeric'})}</div>
        <div class="activity-sub">${new Date(c.checked_in_at).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}${c.new_release_poured ? ' · 🍺 New release' : ''}</div>
      </div>
      <div class="activity-pts">+${c.points_awarded}</div>
    </div>
  `).join('');
}

async function loadBeers() {
  const beers = await sb(`beers?is_on_tap=eq.true&retired=eq.false&select=*&order=is_new_release.desc,name.asc`);
  const el = document.getElementById('beer-list');
  if (!beers.length) { el.innerHTML = '<div class="loading">No beers on tap</div>'; return; }
  el.innerHTML = beers.map(b => `
    <div class="beer-card">
      <div class="beer-name">${b.name}</div>
      <div class="beer-style">${b.style}</div>
      <div class="beer-desc">${b.description}</div>
      <div class="beer-meta">
        <span class="beer-abv">${b.abv}% ABV</span>
        ${b.is_new_release ? '<span class="beer-new">NEW</span>' : ''}
      </div>
    </div>
  `).join('');
}

function loadRewards() {
  const balance = currentMember.points_balance;
  const isPaying = ['Mug Club', 'Coffee Club', 'Full Pour'].includes(currentMember.tier);

  const rewards = [
    { name: 'Treasure box pick', cost: 100, tier: 'Tier 1', paid: false },
    { name: 'Sticker pack', cost: 100, tier: 'Tier 1', paid: false },
    { name: 'Snack item', cost: 150, tier: 'Tier 1', paid: false },
    { name: 'Koozie', cost: 150, tier: 'Tier 1', paid: false },
    { name: 'Pick a trivia category', cost: 250, tier: 'Tier 2', paid: false },
    { name: 'Wall of Regulars', cost: 300, tier: 'Tier 2', paid: false },
    { name: 'LVBC pint glass', cost: 400, tier: 'Tier 2', paid: false },
    { name: 'Free snack up to $10', cost: 400, tier: 'Tier 2', paid: false },
    { name: 'LVBC t-shirt', cost: 750, tier: 'Tier 3', paid: true },
    { name: 'LVBC hat', cost: 750, tier: 'Tier 3', paid: true },
    { name: 'LVBC hoodie', cost: 1000, tier: 'Tier 3', paid: true },
    { name: 'Private tasting for 4', cost: 1500, tier: 'Tier 4', paid: true },
    { name: 'Limestone wall inscription', cost: 5000, tier: 'Tier 5', paid: true },
  ];

  const el = document.getElementById('rewards-list');
  el.innerHTML = rewards.map(r => {
    const canRedeem = balance >= r.cost && (!r.paid || isPaying);
    const locked = r.paid && !isPaying;
    return `
      <div class="reward-card ${!canRedeem ? 'reward-locked' : ''}">
        <div>
          <div class="reward-name">${r.name}</div>
          <div class="reward-tier-label">${r.tier}${locked ? ' · Members only' : balance < r.cost ? ` · Need ${r.cost - balance} more pts` : ' · Available'}</div>
        </div>
        <div>
          <div class="reward-cost">${r.cost}</div>
          <div class="reward-cost-unit">pts</div>
        </div>
      </div>
    `;
  }).join('');
}

function tierClass(tier) {
  if (tier === 'Mug Club') return 'tier-mug';
  if (tier === 'Coffee Club') return 'tier-coffee';
  if (tier === 'Full Pour') return 'tier-full';
  return 'tier-free';
}

function showTab(name, btn) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
  document.getElementById(`tab-${name}`).classList.add('active');
  btn.classList.add('active');
}

function signOut() {
  localStorage.removeItem('lvbc_member_id');
  currentMember = null;
  document.getElementById('app-screen').classList.remove('visible');
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('login-email').value = '';
  document.getElementById('login-error').style.display = 'none';
}

// Auto-login if saved
window.addEventListener('load', () => {
  const savedId = localStorage.getItem('lvbc_member_id');
  if (savedId) loadApp();
});
</script>
</body>
</html>
